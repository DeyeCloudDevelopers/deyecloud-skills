name: Build skill bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build zip
        run: node scripts/pack-skills.mjs
      - name: Verify zip exists
        run: |
          test -f public/skills/deye-open-mcp-skills-*.zip || { echo "zip not produced"; exit 1; }
          echo "Bundle built successfully"
