<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#135eea"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0f1f3a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bg -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M200 0V360M400 0V360M600 0V360M800 0V360M1000 0V360"/>
  </g>

  <!-- ===== LEFT: user asking ===== -->
  <g transform="translate(70,90)">
    <!-- chat bubble -->
    <rect x="0" y="0" width="340" height="120" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M30 120 L30 150 L60 120 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- avatar dot -->
    <circle cx="28" cy="28" r="10" fill="url(#brand)"/>
    <text x="48" y="33" fill="#94a3b8" font-size="13" font-weight="600">You</text>
    <text x="20" y="68" fill="#f1f5f9" font-size="16" font-weight="500">"Today's energy generation</text>
    <text x="20" y="92" fill="#f1f5f9" font-size="16" font-weight="500">for my station — anything offline?"</text>
    <!-- typing cursor -->
    <rect x="310" y="58" width="2" height="20" fill="#3b82f6">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== MIDDLE: AI orchestrates ===== -->
  <g transform="translate(490,70)">
    <!-- AI node -->
    <rect x="0" y="0" width="220" height="160" rx="14" fill="url(#brand)" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="160" rx="14" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
    <!-- sparkle -->
    <g transform="translate(110,52)" filter="url(#glow)">
      <path d="M0 -18 L4 -4 L18 0 L4 4 L0 18 L-4 4 L-18 0 L-4 -4 Z" fill="#60a5fa"/>
    </g>
    <text x="110" y="100" fill="#bfdbfe" font-size="13" font-weight="700" text-anchor="middle">AI Agent</text>
    <text x="110" y="120" fill="#93c5fd" font-size="11" text-anchor="middle">orchestrates 49 MCP tools</text>
    <text x="110" y="138" fill="#93c5fd" font-size="11" text-anchor="middle">→ structured result</text>
    <!-- tool chips -->
    <g font-size="9" font-weight="600">
      <rect x="14" y="150" width="58" height="16" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="43" y="161" fill="#93c5fd" text-anchor="middle">get_token</text>
      <rect x="78" y="150" width="62" height="16" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="109" y="161" fill="#93c5fd" text-anchor="middle">list_stations</text>
      <rect x="146" y="150" width="60" height="16" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="176" y="161" fill="#93c5fd" text-anchor="middle">station_latest</text>
    </g>
  </g>

  <!-- arrows left->mid->right -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M410 150 L485 150" stroke-linecap="round"/>
    <path d="M715 150 L790 150" stroke-linecap="round"/>
  </g>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- ===== RIGHT: station + data ===== -->
  <g transform="translate(800,60)">
    <!-- sun -->
    <circle cx="320" cy="30" r="22" fill="url(#sun)" filter="url(#glow)"/>
    <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <path d="M320 0 V-8M320 68 V60M290 30 H282M358 30 H366M299 9 L293 3M341 51 L347 57M299 51 L293 57M341 9 L347 3"/>
    </g>

    <!-- solar panels (roof) -->
    <g transform="translate(120,40)">
      <path d="M0 60 L120 0 L240 60 Z" fill="url(#panel)" stroke="#1e3a5f" stroke-width="1"/>
      <g stroke="#2c5282" stroke-width="0.8" opacity="0.7">
        <path d="M30 45 L90 0M60 60 L120 0M90 45 L150 0M30 45 L150 45M0 60 L240 60"/>
      </g>
    </g>

    <!-- battery storage -->
    <g transform="translate(20,170)">
      <rect x="0" y="0" width="80" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <rect x="30" y="-6" width="20" height="8" rx="2" fill="#475569"/>
      <rect x="8" y="14" width="64" height="62" rx="3" fill="#0f172a"/>
      <!-- charge level -->
      <rect x="12" y="60" width="56" height="12" fill="#22c55e" opacity="0.9"/>
      <rect x="12" y="44" width="56" height="14" fill="#22c55e" opacity="0.7"/>
      <text x="40" y="90" fill="#94a3b8" font-size="9" text-anchor="middle">SOC 86%</text>
      <text x="40" y="8" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">⚡</text>
    </g>

    <!-- result card -->
    <g transform="translate(120,180)">
      <rect x="0" y="0" width="180" height="90" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1" opacity="0.95"/>
      <text x="14" y="22" fill="#64748b" font-size="10" font-weight="600">TODAY</text>
      <text x="14" y="48" fill="#fbbf24" font-size="22" font-weight="700">42.6 kWh</text>
      <text x="14" y="64" fill="#86efac" font-size="10">▲ +8% vs yesterday</text>
      <circle cx="166" cy="20" r="5" fill="#22c55e"/>
      <text x="14" y="80" fill="#94a3b8" font-size="9">All devices online ✓</text>
    </g>
  </g>

  <!-- ===== title overlay (top) ===== -->
  <text x="600" y="34" fill="#f1f5f9" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">DeyeCloud AI Skills</text>
  <text x="600" y="340" fill="#64748b" font-size="11" text-anchor="middle">Ask in plain English → the AI orchestrates 49 MCP tools → structured result</text>
</svg>
